# 教务管理系统 Nginx 反代配置
# 放到 /etc/nginx/sites-available/edu-admin 后软链到 sites-enabled。
#
# 使用前把 server_name 改成你的域名（已备案）或公网 IP。
# HTTPS 段在有证书后由 certbot --nginx 自动生成，或手动补 443 server 块。

server {
    listen 80;
    # listen [::]:80;   # 若需 IPv6，取消注释
    server_name jiaowu.example.com;   # 改成你的域名或公网 IP

    # 上传上限：应用内 multer 限制 20MB，这里留余量
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 上传/下载的大文件不缓冲，直接透传
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }
}
